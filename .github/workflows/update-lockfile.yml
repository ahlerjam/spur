# Aktualisiert yarn.lock auf dem gewählten Branch, weil lokale Builds hinter einem Proxy scheitern können.
name: Update lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Yarn einrichten
        run: |
          corepack enable
          corepack install -g yarn@4.18.0
      - name: Lockfile aktualisieren
        env:
          CYPRESS_INSTALL_BINARY: "0"
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
        run: yarn install --mode=skip-build
      - name: Änderung committen
        run: |
          if git diff --quiet yarn.lock; then
            echo "Lockfile unverändert."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock
          git commit -m "Lockfile aktualisieren"
          git push origin "HEAD:${GITHUB_REF_NAME}"
