# Prüft das echte Betreiber-Image auf dem Weg aus der README.
name: Smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Publish]
    types: [completed]

permissions:
  contents: read
  packages: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    # MongoDB 8 startet nicht auf Linux-Kerneln 6.19 bis 7.0.13 (SERVER-121912); daher wie in ci.yml dieser Runner.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Kernel
        run: uname -r
      - name: make start
        run: make start
      - name: Status prüfen
        run: |
          for _ in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/status)" = 200 ] && exit 0
            sleep 5
          done
          docker compose logs --tail 100
          exit 1
      - name: Secret prüfen
        run: grep -q '^OVERLEAF_INVITE_TOKEN_SECRET=.' .env
      - name: APA-Compile prüfen
        run: docker compose exec -T sharelatex bash -lc 'cd /overleaf/services/web && node modules/spur/scripts/smoke-compile.mjs'
      - name: Protokolle bei Fehler
        if: failure()
        run: docker compose ps -a; docker compose logs --tail 100
