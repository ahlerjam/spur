# Veröffentlicht das Betreiber-Image für beide Architekturen.
name: Publish

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      BASE: ghcr.io/${{ github.repository_owner }}/spur-base:latest-${{ matrix.arch }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/spur:latest-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Basis bauen
        run: |
          cp server-ce/.dockerignore .dockerignore
          docker build --progress=plain -f server-ce/Dockerfile-base -t "$BASE" .
      # codemirror-indentation-markers kommt per Git und scheiterte im amd64-Build wiederholt.
      - name: Image bauen
        run: |
          for try in 1 2 3; do
            docker build --progress=plain -f server-ce/Dockerfile --build-arg OVERLEAF_BASE_TAG="$BASE" -t "$IMAGE" . && exit 0
            echo "Versuch $try fehlgeschlagen"
            sleep 30
          done
          exit 1
      - name: Veröffentlichen
        run: |
          docker push "$BASE"
          docker push "$IMAGE"

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Mehrarchitektur-Tag setzen
        env:
          REPO: ghcr.io/${{ github.repository_owner }}/spur
        run: docker buildx imagetools create -t "$REPO:latest" "$REPO:latest-amd64" "$REPO:latest-arm64"
