# Betrieb von spur mit dem veröffentlichten Image. Start: `make start`.
services:
  sharelatex:
    restart: always
    image: ${SPUR_IMAGE:-ghcr.io/ahlerjam/spur:latest}
    container_name: spur
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - ${SPUR_PORT:-8080}:80
    stop_grace_period: 60s
    volumes:
      - spur_data:/var/lib/overleaf
    env_file:
      - .env
    environment:
      OVERLEAF_APP_NAME: spur
      OVERLEAF_SITE_URL: ${SPUR_URL:-http://localhost:8080}
      OVERLEAF_MONGO_URL: mongodb://mongo/sharelatex
      OVERLEAF_REDIS_HOST: redis
      REDIS_HOST: redis
      ENABLED_LINKED_FILE_TYPES: "project_file,project_output_file"
      ENABLE_CONVERSIONS: "true"
      EMAIL_CONFIRMATION_DISABLED: "true"
      OVERLEAF_HISTORY_RESTORE: "true"

  mongo:
    restart: always
    image: mongo:8.0
    container_name: spur-mongo
    command: --replSet overleaf
    volumes:
      - spur_mongo:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch(e) { rs.initiate({_id:'overleaf',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s

  redis:
    restart: always
    image: redis:6.2
    container_name: spur-redis
    volumes:
      - spur_redis:/data

volumes:
  spur_data: {}
  spur_mongo: {}
  spur_redis: {}
