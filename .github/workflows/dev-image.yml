# Baut das spur-Image für beide Architekturen und prüft die TeX-Umgebung.
name: Dev image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      BASE: ghcr.io/${{ github.repository_owner }}/spur-base:dev-${{ matrix.arch }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/spur:dev-${{ matrix.arch }}
      DEV: ghcr.io/${{ github.repository_owner }}/spur-dev:${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Größe vorher
        run: |
          if docker pull --quiet "$BASE" > /dev/null 2>&1; then
            docker images --format 'vorher {{.Repository}}:{{.Tag}} {{.Size}}' "$BASE"
          else
            echo "vorher: kein Image $BASE"
          fi
      - name: Basis bauen
        run: |
          cp server-ce/.dockerignore .dockerignore
          time docker build --progress=plain -f server-ce/Dockerfile-base -t "$BASE" .
      - name: TeX-Umgebung prüfen
        run: |
          docker run --rm "$BASE" bash -lc '
            set -e
            for f in biblatex.sty apa.bbx csquotes.sty natbib.sty beamer.cls apa7.cls booktabs.sty minted.sty; do
              kpsewhich "$f"
            done
            biber --version
            latexdiff --version
            pdftotext -v 2>&1 | head -1
            tesseract --list-langs 2>&1 | grep -x deu
          '
      # Smoke-Dokumente mit den Flags aus services/clsi/app/js/LatexRunner.js, ohne -shell-escape.
      - name: Smoke-Dokumente kompilieren
        run: |
          docker run --rm -v "$PWD/services/web/modules/spur/scripts/smoke:/smoke:ro" "$BASE" bash -lc '
            set -e
            cp -r /smoke /tmp/k
            cd /tmp/k
            for doc in apa7-arbeit minted-beispiel shell-escape; do
              aus="/tmp/k/aus-$doc"
              mkdir -p "$aus"
              latexmk -cd -jobname=output -auxdir="$aus" -outdir="$aus" -synctex=1 -interaction=batchmode -time -f -pdf "/tmp/k/$doc.tex" > /dev/null || true
              if [ ! -f "$aus/output.pdf" ]; then
                tail -40 "$aus/output.log"
                echo "$doc: kein PDF"
                exit 1
              fi
              # Nur Fehlerzeilen („! … not found“); biblatex meldet optionale Dateien als „Info: … not found“.
              if grep -E "^! .*not found" "$aus/output.log"; then
                echo "$doc: Datei fehlt im Image"
                exit 1
              fi
              echo "$doc: PDF ok"
            done
            if grep -F "You must invoke LaTeX with the -shell-escape flag" aus-minted-beispiel/output.log; then
              echo "minted braucht Shell-Escape"
              exit 1
            fi
            if [ -e /tmp/spur-shell-test ]; then
              echo "write18 hat einen Befehl ausgeführt"
              exit 1
            fi
            echo "write18 gesperrt"
          '
      - name: Image bauen
        run: time docker build --progress=plain -f server-ce/Dockerfile --build-arg OVERLEAF_BASE_TAG="$BASE" -t "$IMAGE" .
      - name: Pakete im Image prüfen
        run: |
          docker run --rm --network none --entrypoint bash "$IMAGE" -lc '
            set -e
            cd /overleaf/services/web
            yarn node --input-type=module -e "await import(\"@huggingface/transformers\"); await import(\"@modelcontextprotocol/server\"); console.log(\"Pakete ok\")"
          '
      - name: Entwicklungs-Image bauen
        run: time docker build --progress=plain -f server-ce/Dockerfile-dev --build-arg SPUR_IMAGE="$IMAGE" -t "$DEV" .
      - name: Frontend-Build im Entwicklungs-Image messen
        run: |
          docker run --rm --network none --entrypoint bash "$DEV" -lc '
            set -e
            cd /overleaf/services/web
            time yarn run lezer-latex:generate
            time yarn run webpack:production
          '
      - name: Größe nachher
        run: docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep spur
      - name: Veröffentlichen
        run: |
          docker push "$BASE"
          docker push "$IMAGE"
          docker push "$DEV"
